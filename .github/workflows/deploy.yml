name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by portcullis-templates on every push to main (contracts §7).
  repository_dispatch:
    types: [templates-updated]
  # Fallback in case a dispatch was missed (e.g. DOCS_DISPATCH_TOKEN unset).
  schedule:
    - cron: '17 4 * * *'


# gh-pages is force-pushed: let the newest deploy win.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    # Only main is ever published (a dispatch on another branch does
    # nothing here): branches and pull requests run checks.yml.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The templates' main (this job runs on main only). Read as data
      # only: nothing from this checkout is ever run.
      - name: Clone templates repo (for manifest-based catalog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: porelli/portcullis-templates
          ref: main
          path: portcullis-templates
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          # pip's download cache, keyed on the pinned requirements.txt. Only
          # this repo's own pushes, schedules and dispatches run here.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      # scripts/svgsafe.py (the logo lint the generator runs) is a byte copy
      # of the templates' tests/svgsafe.py, compared as data.
      - name: svgsafe copy matches the templates repo
        run: python scripts/check-svgsafe-copy.py portcullis-templates

      # The generator's logo copy and credit (symlinks, the lint, escaping).
      - name: Generator tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate app catalog from manifests
        run: python scripts/generate-app-docs.py --source portcullis-templates

      - name: Branding copies
        run: bash scripts/check-branding.sh

      - name: Build
        run: zensical build --strict --clean

      # Python-Markdown folds a list that follows a paragraph line into it.
      - name: No literal list markers
        run: python scripts/check-lists.py site

      # Same mechanism `mkdocs gh-deploy` used: force-push site/ to gh-pages.
      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force --no-history \
            --message "Deploy ${GITHUB_SHA::7}" site
