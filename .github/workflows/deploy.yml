name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by portcullis-templates on every push to main (contracts §7).
  repository_dispatch:
    types: [templates-updated]
  # Fallback in case a dispatch was missed (e.g. DOCS_DISPATCH_TOKEN unset).
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone templates repo (for manifest-based catalog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: porelli/portcullis-templates
          path: portcullis-templates

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          # pip's download cache, keyed on the pinned requirements.txt. Only
          # this repo's own pushes, schedules and dispatches run here.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Generate app catalog from manifests
        run: python scripts/generate-app-docs.py --source portcullis-templates

      - name: Build
        run: zensical build --strict --clean

      # Same mechanism `mkdocs gh-deploy` used: force-push site/ to gh-pages.
      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force --no-history \
            --message "Deploy ${GITHUB_SHA::7}" site
