name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone templates repo (for manifest-based catalog)
        uses: actions/checkout@v4
        with:
          repository: porelli/portcullis-templates
          path: portcullis-templates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material pyyaml

      - name: Generate app catalog from manifests
        run: python scripts/generate-app-docs.py --source portcullis-templates

      - name: Build and deploy
        run: mkdocs gh-deploy --force
