# Zensical configuration (successor of MkDocs + Material for MkDocs).
# Navigation is NOT declared here: it comes from the per-directory
# docs/**/.nav.yml files (awesome-nav), so scripts/generate-app-docs.py only
# has to write docs/apps/.nav.yml and never touches this file.

[project]
site_name = "Portcullis"
site_description = "Self-hosted YubiKey authentication gateway"
site_url = "https://porelli.github.io/portcullis-docs/"
repo_url = "https://github.com/porelli/portcullis"
repo_name = "porelli/portcullis"
docs_dir = "docs"
site_dir = "site"

[project.theme]
language = "en"
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[project.plugins.search]
[project.plugins.awesome-nav]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
